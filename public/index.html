<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二択サバイバル | HOST</title>
<style>
:root{--bg:#0b1020;--panel:#151c31;--panel2:#1d2742;--text:#f8fafc;--muted:#94a3b8;--a:#ff4d67;--b:#4d8dff;--gold:#ffd166;--ok:#35d07f;--line:#2b385b}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:radial-gradient(circle at top,#182347 0,#0b1020 45%,#070b15 100%);color:var(--text);min-height:100vh}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:.02em}.brand p{margin:6px 0 0;color:var(--muted)}.join{background:#fff;color:#0f172a;padding:10px 14px;border-radius:12px;font-weight:800;text-align:right}.join small{display:block;color:#64748b;font-weight:600}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:18px}.card{background:linear-gradient(180deg,rgba(29,39,66,.95),rgba(18,25,44,.95));border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.28)}.stage{padding:22px;min-height:560px;display:flex;flex-direction:column}.statusline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#0d1427;border:1px solid var(--line);color:#cbd5e1}.question{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:34px 8px}.round{font-size:14px;color:var(--gold);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.qtext{font-size:clamp(34px,6vw,68px);font-weight:950;line-height:1.08;letter-spacing:-.035em}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{min-height:132px;border-radius:20px;padding:20px;display:flex;align-items:center;gap:14px;font-size:clamp(24px,3.4vw,40px);font-weight:900;border:2px solid}.choice.a{background:rgba(255,77,103,.12);border-color:rgba(255,77,103,.65)}.choice.b{background:rgba(77,141,255,.12);border-color:rgba(77,141,255,.65)}.letter{width:54px;height:54px;min-width:54px;border-radius:15px;display:grid;place-items:center;color:#fff}.a .letter{background:var(--a)}.b .letter{background:var(--b)}.answerbox{display:none;background:#0d1427;border:1px solid var(--line);border-radius:18px;padding:18px}.answerbox.show{display:block}.answerline{font-size:24px;font-weight:900}.explain{margin-top:8px;color:#cbd5e1;line-height:1.6}.winner{font-size:36px;color:var(--gold);font-weight:950;margin-top:10px}.players{display:flex;flex-wrap:wrap;gap:8px;padding-top:16px;border-top:1px solid var(--line)}.player{display:flex;align-items:center;gap:8px;background:#0c1326;border:1px solid #263452;border-radius:999px;padding:8px 11px;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.player.answered .dot{background:var(--ok)}.player.dead{opacity:.4;text-decoration:line-through}.score{color:var(--gold);font-weight:800}.side{padding:18px;display:flex;flex-direction:column;gap:16px}.section h2{font-size:14px;color:#aebbd4;text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}.genres{display:grid;grid-template-columns:1fr 1fr;gap:9px}.genre{border:1px solid var(--line);background:#0d1427;color:#e2e8f0;border-radius:13px;padding:12px 10px;font-weight:800;cursor:pointer}.genre.active{border-color:#7c8cff;background:#26345c}.controls{display:grid;gap:10px}.btn{border:0;border-radius:14px;padding:15px 14px;font-size:16px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7c5cff,#4d8dff);color:white}.btn.reveal{background:linear-gradient(135deg,#ff9f43,#ff5e57);color:#fff}.btn.next{background:#e2e8f0;color:#0f172a}.btn.ghost{background:#0d1427;border:1px solid var(--line);color:#cbd5e1}.btn:disabled{opacity:.35;cursor:not-allowed}.select{width:100%;background:#0d1427;color:white;border:1px solid var(--line);border-radius:12px;padding:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#0d1427;border:1px solid var(--line);border-radius:14px;text-align:center;padding:12px 6px}.metric b{display:block;font-size:24px}.metric span{font-size:11px;color:var(--muted)}.hint{font-size:13px;line-height:1.55;color:var(--muted);background:#0d1427;border-radius:12px;padding:12px}.hostwarn{display:none;background:#4b1d2c;border:1px solid #9f3653;color:#ffd9e2;padding:12px;border-radius:12px}.hostwarn.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.join{text-align:left}.stage{min-height:480px}.choices{grid-template-columns:1fr}.choice{min-height:98px}.qtext{font-size:38px}}@media(max-width:480px){.wrap{width:min(100% - 18px,1180px)}.stage{padding:14px}.side{padding:14px}.question{padding:28px 0}.genres{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><h1>⚡ 二択サバイバル</h1><p>全員で選ぶ。外したら脱落。最後の1人まで。</p></div>
    <div class="join"><small>参加者はこちら</small><span id="joinUrl">/play.html</span></div>
  </div>
  <div class="grid">
    <main class="card stage">
      <div class="statusline"><span id="phasePill" class="pill">待機中</span><span id="genreLabel">盛り上がり雑学</span></div>
      <section class="question" id="questionArea">
        <div class="round" id="roundLabel">READY</div>
        <div class="qtext" id="qText">参加者を集めて<br>ゲームを始めよう</div>
        <div class="choices" id="choices" style="display:none">
          <div class="choice a"><div class="letter">A</div><div id="choiceA"></div></div>
          <div class="choice b"><div class="letter">B</div><div id="choiceB"></div></div>
        </div>
        <div class="answerbox" id="answerBox"><div class="answerline" id="answerLine"></div><div class="explain" id="explain"></div><div class="winner" id="winner"></div></div>
      </section>
      <div class="players" id="players"><span style="color:#64748b">まだ参加者はいません</span></div>
    </main>
    <aside class="card side">
      <div id="hostWarn" class="hostwarn">別の端末がすでにホストとして接続しています。</div>
      <section class="section"><h2>Game status</h2><div class="metrics"><div class="metric"><b id="countAll">0</b><span>参加</span></div><div class="metric"><b id="countAlive">0</b><span>生存</span></div><div class="metric"><b id="countAnswered">0</b><span>回答済</span></div></div></section>
      <section class="section"><h2>Genre</h2><div class="genres" id="genres"></div></section>
      <section class="section"><h2>Question</h2><div class="controls"><button id="randomBtn" class="btn primary">🎲 ランダム出題</button><select id="questionSelect" class="select"><option>問題一覧を読み込み中...</option></select><button id="manualBtn" class="btn ghost">選んだ問題を出題</button></div></section>
      <section class="section"><h2>Progress</h2><div class="controls"><button id="revealBtn" class="btn reveal" disabled>🎉 正解発表</button><button id="nextBtn" class="btn next" disabled>➡ 次のラウンドへ</button><button id="resetBtn" class="btn ghost">↺ 全員復活して最初から</button></div></section>
      <div class="hint">おすすめ進行：参加者を集める → ランダム出題 → 全員回答 → 正解発表 → 次のラウンド。回答内容は発表までホスト画面にも表示しません。</div>
    </aside>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let selectedGenre='party',currentState={phase:'lobby',round:0};let latestPlayers={};
const $=id=>document.getElementById(id);$('joinUrl').textContent=location.origin+'/play.html';
socket.emit('registerHost');
socket.on('hostGranted',ok=>{if(!ok)$('hostWarn').classList.add('show')});
socket.on('genres',genres=>{const box=$('genres');box.innerHTML='';Object.entries(genres).forEach(([key,label])=>{const b=document.createElement('button');b.className='genre'+(key===selectedGenre?' active':'');b.textContent=label;b.onclick=()=>{selectedGenre=key;document.querySelectorAll('.genre').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('genreLabel').textContent=label;socket.emit('getQuestions',key)};box.appendChild(b)});socket.emit('getQuestions',selectedGenre)});
socket.on('questionsList',payload=>{const s=$('questionSelect');s.innerHTML='';payload.questions.forEach(q=>{const o=document.createElement('option');o.value=q.index;o.textContent=`${q.question}｜${q.choiceA} / ${q.choiceB}`;s.appendChild(o)})});
socket.on('gameState',state=>{currentState=state;$('countAll').textContent=state.playerCount;$('countAlive').textContent=state.aliveCount;const labels={lobby:'待機中',question:'回答受付中',result:'結果発表',finished:'ゲーム終了'};$('phasePill').textContent=labels[state.phase]||state.phase;$('roundLabel').textContent=state.round?`ROUND ${state.round}`:'READY';$('revealBtn').disabled=state.phase!=='question';$('nextBtn').disabled=state.phase!=='result';$('randomBtn').disabled=state.phase==='question';$('manualBtn').disabled=state.phase==='question';if(state.currentQuestion){$('qText').textContent=state.currentQuestion.question;$('choiceA').textContent=state.currentQuestion.choiceA;$('choiceB').textContent=state.currentQuestion.choiceB;$('choices').style.display='grid'}else if(state.phase==='lobby'){$('qText').innerHTML=state.round?'次の問題を出題しよう':'参加者を集めて<br>ゲームを始めよう';$('choices').style.display='none';$('answerBox').classList.remove('show')}renderPlayers()});
socket.on('update',players=>{latestPlayers=players;renderPlayers()});
socket.on('showAnswer',data=>{const text=data.correct==='A'?data.choiceA:data.choiceB;$('answerLine').textContent=`正解は ${data.correct}「${text}」`;$('explain').textContent=data.explanation||'';$('winner').textContent=data.winner?`🏆 WINNER：${data.winner}`:'';$('answerBox').classList.add('show')});
socket.on('clear-question',()=>{$('answerBox').classList.remove('show')});
socket.on('gameReset',()=>{$('answerBox').classList.remove('show');$('winner').textContent=''});
function renderPlayers(){const box=$('players');const arr=Object.values(latestPlayers);$('countAnswered').textContent=arr.filter(p=>p.answered).length;if(!arr.length){box.innerHTML='<span style="color:#64748b">まだ参加者はいません</span>';return}box.innerHTML='';arr.sort((a,b)=>(a.status==='dead')-(b.status==='dead')||b.progress-a.progress).forEach(p=>{const d=document.createElement('div');d.className='player '+(p.answered?'answered ':'')+(p.status==='dead'?'dead':'');d.innerHTML=`<span class="dot"></span><strong>${escapeHtml(p.name)}</strong><span class="score">${p.progress}</span>`;box.appendChild(d)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('randomBtn').onclick=()=>socket.emit('startRandom',selectedGenre);$('manualBtn').onclick=()=>socket.emit('loadQuestion',Number($('questionSelect').value),selectedGenre);$('revealBtn').onclick=()=>socket.emit('revealAnswer');$('nextBtn').onclick=()=>socket.emit('next');$('resetBtn').onclick=()=>{if(confirm('全員を復活させ、スコアも0に戻しますか？'))socket.emit('resetGame')};
</script>
</body>
</html>
