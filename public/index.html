<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>二択サバイバル | HOST</title>
<style>:root{--bg:#09101d;--panel:#141d31;--line:#2b385b;--text:#f8fafc;--muted:#94a3b8;--a:#ff4d67;--b:#4d8dff;--ok:#35d07f;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182347,#09101d 48%,#050912);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;min-height:100vh}.wrap{width:min(1200px,calc(100% - 24px));margin:auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:clamp(28px,5vw,46px)}.top p{margin:5px 0 0;color:var(--muted)}.joinurl{background:#fff;color:#111827;border-radius:12px;padding:10px 13px;font-weight:800;max-width:100%;overflow-wrap:anywhere}.shareActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.shareBtn{border:0;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer;background:#e5e7eb;color:#111827}.shareBtn.primaryShare{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(310px,.7fr);gap:16px}.card{background:linear-gradient(180deg,rgba(29,39,66,.96),rgba(17,24,39,.96));border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.stage{padding:18px}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.pill{background:#0d1427;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.qbox{padding:24px 4px 14px}.round{color:var(--gold);font-weight:900;font-size:13px}.rule{color:#c4b5fd;font-size:13px;font-weight:900;margin-top:5px}.qtext{font-size:clamp(30px,5vw,58px);font-weight:950;line-height:1.08;margin:12px 0 16px}.choiceLabels{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choiceLabel{border:2px solid;border-radius:18px;padding:15px;font-size:clamp(22px,3vw,34px);font-weight:900}.choiceLabel.a{border-color:var(--a);background:rgba(255,77,103,.12)}.choiceLabel.b{border-color:var(--b);background:rgba(77,141,255,.12)}.arena{position:relative;height:300px;margin-top:16px;border-radius:22px;overflow:hidden;background:linear-gradient(#173152 0 56%,#32452c 56% 67%,#5f4931 67% 100%);border:1px solid rgba(255,255,255,.09)}.arena:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.25)}.zone{position:absolute;top:14px;font-size:30px;font-weight:950;z-index:2;text-shadow:0 2px 8px #000}.zone.a{left:22px;color:#ff8797}.zone.b{right:22px;color:#8eb6ff}.characters{position:absolute;inset:0}.char{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);transition:left .45s cubic-bezier(.2,.8,.2,1),bottom .45s ease,opacity .45s ease;z-index:4;text-align:center;min-width:56px}.char.a{left:24%}.char.b{left:76%}.char .head{font-size:30px;line-height:1}.char .body{width:18px;height:28px;background:#f8d36b;border-radius:8px 8px 5px 5px;margin:1px auto 0;position:relative}.char .body:before,.char .body:after{content:"";position:absolute;top:7px;width:15px;height:5px;background:#f8d36b;border-radius:5px}.char .body:before{left:-11px;transform:rotate(18deg)}.char .body:after{right:-11px;transform:rotate(-18deg)}.char .legs{display:flex;gap:8px;justify-content:center}.char .legs span{width:5px;height:15px;background:#f8d36b;border-radius:5px}.char .name{margin-top:4px;background:rgba(6,10,20,.78);padding:3px 7px;border-radius:999px;font-size:11px;white-space:nowrap}.char.dead{animation:fall .8s ease-in forwards}.char.cheer .body,.char.cheer .head{animation:bounce .55s ease-in-out 2}.char.cheer .body:before{transform:rotate(-45deg);top:2px}.char.cheer .body:after{transform:rotate(45deg);top:2px}.char.host .name{outline:2px solid var(--gold)}@keyframes fall{0%{bottom:35px;transform:translateX(-50%) rotate(0);opacity:1}100%{bottom:-90px;transform:translateX(-50%) rotate(35deg);opacity:.1}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}.answerbox{display:none;margin-top:14px;background:#0c1425;border:1px solid var(--line);border-radius:16px;padding:15px}.answerbox.show{display:block}.answerline{font-size:24px;font-weight:950}.winner{color:var(--gold);font-size:30px;font-weight:950;margin-top:8px}.players{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pchip{background:#0c1425;border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:12px}.pchip.dead{opacity:.4;text-decoration:line-through}.side{padding:16px;display:flex;flex-direction:column;gap:14px}.section h2{font-size:12px;color:#aebbd4;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#0d1427;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.metric b{display:block;font-size:22px}.metric span{font-size:10px;color:var(--muted)}.genres{display:grid;grid-template-columns:1fr 1fr;gap:7px}.genre,.btn,.select,.hostInput{border-radius:12px;border:1px solid var(--line);padding:11px;background:#0d1427;color:white;font-weight:800}.genre{cursor:pointer}.genre.active{background:#27365e;border-color:#8190ff}.controls{display:grid;gap:8px}.btn{cursor:pointer;font-size:14px}.primary{background:linear-gradient(135deg,#765cff,#4d8dff)}.reveal{background:linear-gradient(135deg,#ff9f43,#ff5e57)}.light{background:#e2e8f0;color:#111827}.btn:disabled{opacity:.35;cursor:not-allowed}.hostPlay{background:#0c1425;border:1px solid var(--line);border-radius:14px;padding:11px}.hostRow{display:flex;gap:7px}.hostInput{width:100%}.hostChoices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.hostChoice{border:0;border-radius:12px;padding:14px;color:white;font-size:17px;font-weight:950;cursor:pointer}.hostChoice.a{background:var(--a)}.hostChoice.b{background:var(--b)}.hostChoice.selected{outline:4px solid white}.hint{font-size:12px;color:var(--muted);line-height:1.5}.qrModal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:999;padding:18px}.qrModal.show{display:flex}.qrCard{background:white;color:#111827;border-radius:24px;padding:20px;text-align:center;width:min(92vw,380px);box-shadow:0 24px 70px rgba(0,0,0,.45)}.qrCard h2{margin:0 0 8px}.qrCard p{margin:0 0 14px;color:#4b5563;font-size:13px}.qrImage{width:min(72vw,300px);height:auto;max-width:300px;background:white;border-radius:12px;display:block;margin:auto}.qrClose{margin-top:14px;border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:#111827;color:white;width:100%;cursor:pointer}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:1000}.toast.show{opacity:1}@media(max-width:860px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.arena{height:260px}.genres{grid-template-columns:1fr 1fr}.joinurl{width:100%}}@media(max-width:480px){.wrap{width:calc(100% - 14px)}.stage,.side{padding:12px}.choiceLabels{grid-template-columns:1fr}.arena{height:230px}.qtext{font-size:34px}.shareActions{display:grid;grid-template-columns:1fr 1fr}.shareBtn.primaryShare{grid-column:1/-1}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>⚡ 二択サバイバル</h1><p>選んだ側へ移動。外したら落下。正解なら歓喜。</p></div><div class="joinurl"><small>参加URL</small><div id="joinUrl">/play.html</div><div class="shareActions"><button id="qrBtn" class="shareBtn primaryShare">📷 QRを表示</button><button id="copyBtn" class="shareBtn">📋 コピー</button><button id="shareBtn" class="shareBtn">↗ 共有</button></div></div></div><div class="grid"><main class="card stage"><div class="status"><span id="phase" class="pill">接続中</span><span id="genreLabel">盛り上がり雑学</span></div><div class="qbox"><div id="round" class="round">READY</div><div id="rule" class="rule"></div><div id="qText" class="qtext">参加者を集めてゲームを始めよう</div><div id="choiceLabels" class="choiceLabels" style="display:none"><div class="choiceLabel a">A <span id="choiceA"></span></div><div class="choiceLabel b">B <span id="choiceB"></span></div></div></div><div class="arena"><div class="zone a">← A</div><div class="zone b">B →</div><div id="characters" class="characters"></div></div><div id="answerBox" class="answerbox"><div id="answerLine" class="answerline"></div><div id="explain"></div><div id="winner" class="winner"></div></div><div id="players" class="players"></div></main><aside class="card side"><section class="section"><h2>Game status</h2><div class="metrics"><div class="metric"><b id="all">0</b><span>参加</span></div><div class="metric"><b id="alive">0</b><span>生存</span></div><div class="metric"><b id="answered">0</b><span>回答済</span></div></div></section><section class="section"><h2>Host play</h2><div class="hostPlay"><div class="hostRow"><input id="hostName" class="hostInput" maxlength="12" placeholder="管理者の名前"><button id="hostJoin" class="btn primary">参加</button></div><div id="hostPlayInfo" class="hint" style="margin-top:6px">管理者もこの画面から参加できます。</div><div id="hostChoices" class="hostChoices" style="display:none"><button class="hostChoice a" data-choice="A">Aを選ぶ</button><button class="hostChoice b" data-choice="B">Bを選ぶ</button></div></div></section><section class="section"><h2>Genre</h2><div id="genres" class="genres"></div></section><section class="section"><h2>Question</h2><div class="controls"><button id="random" class="btn primary">🎲 ランダム出題</button><select id="qselect" class="select"><option>問題を読み込み中...</option></select><button id="manual" class="btn">選んだ問題を出題</button></div></section><section class="section"><h2>Progress</h2><div class="controls"><button id="reveal" class="btn reveal" disabled>🎉 正解発表</button><button id="next" class="btn light" disabled>➡ 次のラウンドへ</button><button id="reset" class="btn">↺ 全員復活して最初から</button></div></section><div class="hint">ミニキャラは回答した瞬間にA/Bへ移動。通常問題は正解側、多数派問題は人数が多い側が生き残ります。</div></aside></div></div>
<div id="qrModal" class="qrModal"><div class="qrCard"><h2>📱 参加QR</h2><p>スマホのカメラで読み取って参加</p><img id="qrImage" class="qrImage" alt="参加用QRコード"><button id="qrClose" class="qrClose">閉じる</button></div></div><div id="toast" class="toast">コピーしました</div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let selectedGenre='party',state={phase:'lobby',round:0},players={},hostJoined=false,hostName='',lastCorrect=null,lastRule='quiz';const joinUrl=location.origin+'/play.html';$('joinUrl').textContent=joinUrl;
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
socket.on('connect',()=>{socket.emit('registerHost')});socket.on('disconnect',()=>{$('phase').textContent='再接続中…'});socket.on('hostGranted',()=>{socket.emit('getQuestions',selectedGenre)});socket.on('hostRevoked',()=>toast('別の管理画面に操作権限が移りました'));socket.on('hostError',msg=>{toast(msg||'管理者接続を更新します');socket.emit('registerHost')});
socket.on('genres',genres=>{const box=$('genres');box.innerHTML='';Object.entries(genres).forEach(([k,label])=>{const b=document.createElement('button');b.className='genre'+(k===selectedGenre?' active':'');b.textContent=label;b.onclick=()=>{selectedGenre=k;document.querySelectorAll('.genre').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('genreLabel').textContent=label;socket.emit('getQuestions',k)};box.appendChild(b)})});socket.on('questionsList',p=>{const s=$('qselect');s.innerHTML='';p.questions.forEach(q=>{const o=document.createElement('option');o.value=q.index;o.textContent=`${q.question}｜${q.choiceA} / ${q.choiceB}`;s.appendChild(o)})});socket.on('joined',d=>{hostJoined=true;hostName=d.name;$('hostPlayInfo').textContent=`${hostName} として参加中`;updateHostChoices()});socket.on('gameState',s=>{state=s;$('all').textContent=s.playerCount;$('alive').textContent=s.aliveCount;$('phase').textContent=({lobby:'待機中',question:'回答受付中',result:'結果発表',finished:'ゲーム終了'})[s.phase]||s.phase;$('round').textContent=s.round?`ROUND ${s.round}`:'READY';$('reveal').disabled=s.phase!=='question';$('next').disabled=s.phase!=='result';$('random').disabled=s.phase==='question';$('manual').disabled=s.phase==='question';if(s.currentQuestion){lastRule=s.currentQuestion.rule||'quiz';$('rule').textContent=lastRule==='majority'?'👥 多数派に入れば生き残り':'🎯 正解を当てれば生き残り';$('qText').textContent=s.currentQuestion.question;$('choiceA').textContent=s.currentQuestion.choiceA;$('choiceB').textContent=s.currentQuestion.choiceB;$('choiceLabels').style.display='grid'}else if(s.phase==='lobby'){$('rule').textContent='';$('qText').textContent=s.round?'次の問題を出題しよう':'参加者を集めてゲームを始めよう';$('choiceLabels').style.display='none';$('answerBox').classList.remove('show');lastCorrect=null}updateHostChoices();render()});socket.on('update',p=>{players=p;$('answered').textContent=Object.values(p).filter(x=>x.answered).length;render();updateHostChoices()});socket.on('choiceAccepted',choice=>document.querySelectorAll('.hostChoice').forEach(b=>b.classList.toggle('selected',b.dataset.choice===choice)));socket.on('showAnswer',d=>{lastCorrect=d.correct;lastRule=d.rule||'quiz';if(d.correct==='TIE')$('answerLine').textContent='同数！回答した人は全員セーフ';else{const t=d.correct==='A'?d.choiceA:d.choiceB;$('answerLine').textContent=d.rule==='majority'?`多数派は ${d.correct}「${t}」 (${d.counts.A}:${d.counts.B})`:`正解は ${d.correct}「${t}」`}$('explain').textContent=d.explanation||'';$('winner').textContent=d.winner?`🏆 WINNER：${d.winner}`:'';$('answerBox').classList.add('show');render()});socket.on('clear-question',()=>{$('answerBox').classList.remove('show');lastCorrect=null;document.querySelectorAll('.hostChoice').forEach(b=>b.classList.remove('selected'))});socket.on('gameReset',()=>{lastCorrect=null;$('answerBox').classList.remove('show');document.querySelectorAll('.hostChoice').forEach(b=>b.classList.remove('selected'))});function updateHostChoices(){const me=players[socket.id];const can=hostJoined&&state.phase==='question'&&me&&me.status==='alive';$('hostChoices').style.display=can?'grid':'none'}function render(){const chars=$('characters'),list=$('players');chars.innerHTML='';list.innerHTML='';Object.entries(players).forEach(([id,p],i)=>{const c=document.createElement('div');let cls='char';if(p.choice==='A')cls+=' a';if(p.choice==='B')cls+=' b';if(id===socket.id)cls+=' host';if(lastCorrect&&p.status==='dead')cls+=' dead';else if(lastCorrect&&p.status==='alive'&&p.choice)cls+=' cheer';c.className=cls;c.style.marginLeft=((i%7)-3)*9+'px';c.innerHTML=`<div class="head">🙂</div><div class="body"></div><div class="legs"><span></span><span></span></div><div class="name">${esc(p.name)}</div>`;chars.appendChild(c);const chip=document.createElement('div');chip.className='pchip'+(p.status==='dead'?' dead':'');chip.textContent=`${p.name} ${p.progress}`;list.appendChild(chip)})}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('qrBtn').onclick=()=>{const img=$('qrImage');img.onload=()=>$('qrModal').classList.add('show');img.onerror=()=>toast('QR生成に失敗しました');img.src='/join-qr.svg?v='+Date.now()};$('qrClose').onclick=()=>$('qrModal').classList.remove('show');$('qrModal').onclick=e=>{if(e.target===$('qrModal'))$('qrModal').classList.remove('show')};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(joinUrl);toast('参加URLをコピーしました')}catch{prompt('このURLをコピーしてください',joinUrl)}};$('shareBtn').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'二択サバイバル',text:'ここから参加してね！',url:joinUrl})}catch{}}else $('copyBtn').click()};$('hostJoin').onclick=()=>{const n=$('hostName').value.trim();if(n)socket.emit('join',n)};document.querySelectorAll('.hostChoice').forEach(b=>b.onclick=()=>socket.emit('choose',b.dataset.choice));$('random').onclick=()=>socket.emit('startRandom',selectedGenre);$('manual').onclick=()=>socket.emit('loadQuestion',Number($('qselect').value),selectedGenre);$('reveal').onclick=()=>socket.emit('revealAnswer');$('next').onclick=()=>socket.emit('next');$('reset').onclick=()=>{if(confirm('全員を復活させ、スコアも0に戻しますか？'))socket.emit('resetGame')};
</script></body></html>
