<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二択サバイバル - メイン画面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        h1 { 
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        /* メイン画面セクション */
        .main-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #question-display {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-title {
            font-size: 70px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .choices-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .choice-box {
            background: white;
            border-radius: 10px;
            padding: 20px 30px;
            font-size: 28px;
            font-weight: bold;
            min-width: 150px;
            text-align: center;
        }

        .choice-a {
            color: #ff3333;
            border: 4px solid #ff3333;
        }

        .choice-b {
            color: #3333ff;
            border: 4px solid #3333ff;
        }

        .vs-text {
            font-size: 32px;
            font-weight: bold;
            color: #666;
            margin: 0 10px;
        }

        /* ゲーム進行エリア */
        #field {
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, #e8f4f8, #fff);
            border: 5px solid #333;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .line { 
            position: absolute; 
            left: 50%; 
            top: 0; 
            width: 5px; 
            height: 100%; 
            background: #999; 
            margin-left: -2.5px; 
        }

        .track { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            height: 70px; 
            background: #8B4513; 
            border-top: 4px solid #654321; 
        }

        .track-line { 
            position: absolute; 
            left: 0; 
            width: 2px; 
            height: 70px; 
            background: #654321; 
        }

        .area-a, .area-b {
            position: absolute;
            top: 15px;
            font-size: 50px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .area-a { 
            left: 5%; 
            color: #ff3333;
        }

        .area-b { 
            right: 5%; 
            color: #3333ff;
        }

        .player {
            position: absolute;
            bottom: 10px;
            width: 60px;
            height: 60px;
            background: #ffcc00;
            border-radius: 50%;
            border: 3px solid #333;
            line-height: 30px;
            font-weight: bold;
            font-size: 12px;
            transform: translateX(-50%);
            transition: left 0.5s ease, bottom 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .player-progress {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #333;
            background: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        .player-name {
            margin-top: 2px;
        }

        .dead { 
            background: #555; 
            color: #fff; 
            opacity: 0.5; 
        }

        /* コントロールセクション */
        .control-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        /* ジャンル選択 */
        .genre-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-genre {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            padding: 18px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-genre:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .btn-genre:active {
            transform: translateY(-1px);
        }

        /* 問題選択エリア */
        .question-selection {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        #question-select {
            font-size: 18px;
            padding: 15px;
            width: 100%;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        #question-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-question {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            font-size: 20px;
            padding: 18px;
            width: 100%;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-question:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        /* ゲーム進行ボタン */
        .game-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-judge {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            font-size: 22px;
            padding: 25px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-judge:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        .btn-judge:active {
            transform: translateY(-1px);
        }

        .btn-next {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            font-size: 22px;
            padding: 25px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            
            .question-title { font-size: 48px; }
            
            .choice-box {
                font-size: 20px;
                padding: 15px 20px;
                min-width: 120px;
            }
            
            .vs-text { font-size: 24px; }
            
            #field { height: 280px; }
            
            .area-a, .area-b { font-size: 36px; }
            
            .player { width: 50px; height: 50px; }
            
            .section-title { font-size: 22px; }
            
            .btn-genre, .btn-question, .btn-judge, .btn-next {
                font-size: 16px;
                padding: 15px;
            }
            
            .game-controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            
            h1 { font-size: 28px; margin-bottom: 3px; }
            
            .subtitle { font-size: 14px; }
            
            .main-section, .control-section {
                padding: 15px;
                margin-bottom: 15px;
            }
            
            #question-display { padding: 25px; }
            
            .question-title { font-size: 36px; margin-bottom: 12px; }
            
            .choice-box {
                font-size: 16px;
                padding: 12px 15px;
                min-width: 100px;
            }
            
            .vs-text { font-size: 18px; margin: 0 8px; }
            
            #field { height: 240px; }
            
            .area-a, .area-b { font-size: 28px; top: 10px; }
            
            .player { width: 45px; height: 45px; font-size: 10px; }
            
            .player-progress { 
                width: 24px; 
                height: 24px; 
                font-size: 12px;
                top: -22px;
            }
            
            .section-title { font-size: 20px; }
            
            .genre-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            
            .btn-genre {
                font-size: 14px;
                padding: 12px;
            }
            
            #question-select {
                font-size: 16px;
                padding: 12px;
                margin-bottom: 10px;
            }
            
            .btn-question, .btn-judge, .btn-next {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚂 二択サバイバル！</h1>
            <p class="subtitle">トロッコレース - 飲みの場で大盛り上がり！</p>
            <p class="subtitle">参加者はスマホで <strong>/play.html</strong> にアクセス</p>
        </header>

        <div class="main-section">
            <div id="question-display">
                <div class="question-title">🚀</div>
                <div style="font-size: 20px; color: #666;">お題を選んでスタート</div>
            </div>

            <div id="field">
                <div class="line"></div>
                <div class="area-a">← A</div>
                <div class="area-b">B →</div>
                <div class="track">
                    <div id="track-lines"></div>
                </div>
                <div id="players-container"></div>
            </div>
        </div>

        <div class="control-section">
            <div class="section-title">🎯 ジャンル選択</div>
            <div class="genre-buttons">
                <button class="btn-genre" onclick="selectGenre('kanji')">📚 難読漢字</button>
                <button class="btn-genre" onclick="selectGenre('country_area')">🗺️ 国の面積</button>
                <button class="btn-genre" onclick="selectGenre('country_population')">👥 国の人口</button>
                <button class="btn-genre" onclick="selectGenre('general')">🌍 一般常識</button>
            </div>
        </div>

        <div class="control-section">
            <div class="section-title">📝 お題選択</div>
            <div class="question-selection">
                <select id="question-select" onchange="loadSelectedQuestion()">
                    <option value="">-- ジャンルを選んでからお題を選択 --</option>
                </select>
                <button class="btn-question" onclick="loadSelectedQuestion()">🎬 お題をセット</button>
            </div>
        </div>

        <div class="control-section">
            <div class="section-title">⚔️ ゲーム進行</div>
            <div class="game-controls">
                <button class="btn-judge" onclick="judge('A')">✅ A が正解</button>
                <button class="btn-judge" onclick="judge('B')">✅ B が正解</button>
                <button class="btn-next">➡️ 次の問題へ</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('players-container');
        const questionDisplay = document.getElementById('question-display');
        const questionSelect = document.getElementById('question-select');
        const trackLines = document.getElementById('track-lines');
        const nextButton = document.querySelector('.btn-next');
        
        let currentGenre = 'kanji';
        let currentQuestions = [];

        // トラックのラインを描画
        function drawTrackLines() {
            trackLines.innerHTML = '';
            for (let i = 0; i < 100; i += 10) {
                const line = document.createElement('div');
                line.className = 'track-line';
                line.style.left = i + '%';
                trackLines.appendChild(line);
            }
        }
        drawTrackLines();

        // ジャンル選択
        function selectGenre(genre) {
            currentGenre = genre;
            socket.emit('getQuestions', genre);
        }

        // サーバーから問題リストを受け取る
        socket.on('questionsList', (questions) => {
            currentQuestions = questions;
            populateQuestionSelect();
        });

        // ドロップダウンに問題を追加
        function populateQuestionSelect() {
            questionSelect.innerHTML = '<option value="">-- お題を選んでください --</option>';
            currentQuestions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index;
                const difficulty = '⭐'.repeat(q.difficulty);
                option.textContent = `${index + 1}. ${q.question}  ${difficulty}`;
                questionSelect.appendChild(option);
            });
        }

        // Socket.io イベント
        socket.on('update', (players) => {
            container.innerHTML = '';
            for (let id in players) {
                const p = players[id];
                const div = document.createElement('div');
                div.className = 'player ' + (p.status === 'dead' ? 'dead' : '');
                div.style.left = p.x + '%';
                
                // プログレス表示
                const progress = document.createElement('div');
                progress.className = 'player-progress';
                progress.textContent = p.progress;
                
                // 名前表示
                const nameSpan = document.createElement('div');
                nameSpan.className = 'player-name';
                nameSpan.textContent = p.name.substring(0, 4);
                
                div.appendChild(progress);
                div.appendChild(nameSpan);
                container.appendChild(div);
            }
        });

        socket.on('question', (question) => {
            displayQuestion(question);
        });

        socket.on('clear-question', () => {
            questionDisplay.innerHTML = `
                <div class="question-title">🚀</div>
                <div style="font-size: 20px; color: #666;">次のお題をセット</div>
            `;
            questionSelect.value = '';
        });

        // 関数
        function displayQuestion(question) {
            questionDisplay.innerHTML = `
                <div class="question-title">❓ ${question.question}</div>
                <div class="choices-display">
                    <div class="choice-box choice-a">A: ${question.choiceA}</div>
                    <div class="vs-text">VS</div>
                    <div class="choice-box choice-b">B: ${question.choiceB}</div>
                </div>
            `;
        }

        function loadSelectedQuestion() {
            const index = questionSelect.value;
            if (index !== '') {
                socket.emit('loadQuestion', parseInt(index), currentGenre);
            }
        }

        function judge(answer) { socket.emit('judge', answer); }

        // 次の問題ボタン
        nextButton.addEventListener('click', function() {
            socket.emit('next');
        });

        // 初期ジャンル読み込み
        selectGenre('kanji');
    </script>
</body>
</html>
