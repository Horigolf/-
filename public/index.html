<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二択サバイバル - メイン画面</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f8ff; }
        #field {
            width: 80%; height: 400px; background: #fff; border: 4px solid #333;
            margin: 20px auto; position: relative; overflow: hidden;
        }
        .line { position: absolute; left: 50%; top: 0; width: 4px; height: 100%; background: #ccc; margin-left: -2px; }
        .area-a { position: absolute; left: 10%; top: 10px; font-size: 40px; color: red; font-weight: bold;}
        .area-b { position: absolute; right: 10%; top: 10px; font-size: 40px; color: blue; font-weight: bold;}
        .player {
            position: absolute; bottom: 20px; width: 50px; height: 50px; background: #ffcc00;
            border-radius: 50%; border: 2px solid #333; line-height: 50px; font-weight: bold; font-size: 12px;
            transform: translateX(-50%); transition: left 0.5s ease;
        }
        .dead { background: #555; color: #fff; text-decoration: line-through; opacity: 0.5; bottom: 5px !important;}
        #controls { margin-top: 20px; padding: 15px; background: #eee; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>二択サバイバル！</h1>
    <p>参加者はスマホで <strong>/play.html</strong> にアクセス！</p>
    
    <div id="field">
        <div class="line"></div>
        <div class="area-a">A (左)</div>
        <div class="area-b">B (右)</div>
        <div id="players-container"></div>
    </div>

    <div id="controls">
        <h3>進行役コントローラー</h3>
        <button onclick="judge('A')">正解は【A】（Bは脱落）</button>
        <button onclick="judge('B')">正解は【B】（Aは脱落）</button>
        <button onclick="nextQuestion()">次の問題へ（位置リセット）</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('players-container');

        socket.on('update', (players) => {
            container.innerHTML = '';
            for (let id in players) {
                const p = players[id];
                const div = document.createElement('div');
                div.className = 'player ' + (p.status === 'dead' ? 'dead' : '');
                div.style.left = p.x + '%';
                div.innerText = p.name;
                container.appendChild(div);
            }
        });

        function judge(answer) { socket.emit('judge', answer); }
        function nextQuestion() { socket.emit('next'); }
    </script>
</body>
</html>
