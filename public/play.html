<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>二択サバイバル</title>
<style>
:root{--text:#f8fafc;--muted:#94a3b8;--a:#ff4d67;--b:#4d8dff;--ok:#35d07f;--gold:#ffd166;--panel:#151c31;--line:#2a3858}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:radial-gradient(circle at top,#182347 0,#0b1020 50%,#070b15 100%);color:var(--text)}body{min-height:100vh;min-height:100dvh}.screen{min-height:100vh;min-height:100dvh;padding:18px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}.brand{text-align:center;padding:8px 0 18px}.brand h1{font-size:28px;margin:0}.brand p{color:var(--muted);margin:6px 0 0;font-size:14px}.card{background:rgba(21,28,49,.96);border:1px solid rgba(255,255,255,.08);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28)}#joinCard{padding:22px;margin:auto 0}.joinTitle{font-size:30px;font-weight:950;line-height:1.2}.input{width:100%;margin-top:18px;border:1px solid #34415f;background:#0d1427;color:#fff;border-radius:16px;padding:17px;font-size:18px;outline:none}.btn{border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:900;width:100%;cursor:pointer}.btn.join{margin-top:12px;background:linear-gradient(135deg,#7c5cff,#4d8dff);color:white}.game{display:none;flex:1;flex-direction:column;gap:14px}.game.show{display:flex}.status{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.pill{background:#10182b;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.questionCard{padding:20px;flex:1;display:flex;flex-direction:column}.round{color:var(--gold);font-size:13px;font-weight:900;letter-spacing:.08em}.rule{font-size:12px;color:#c4b5fd;font-weight:900;margin-top:6px}.qtext{font-size:clamp(28px,7vw,46px);font-weight:950;line-height:1.12;letter-spacing:-.035em;margin:16px 0 18px}.choices{display:grid;gap:13px}.choice{border:2px solid;border-radius:22px;min-height:116px;padding:18px;display:flex;align-items:center;gap:16px;color:white;cursor:pointer;transition:.18s transform,.18s opacity,.18s filter,.18s box-shadow}.choice:active{transform:scale(.985)}.choice.a{background:linear-gradient(135deg,rgba(255,77,103,.95),rgba(204,45,75,.95));border-color:#ff8396}.choice.b{background:linear-gradient(135deg,rgba(77,141,255,.95),rgba(55,90,208,.95));border-color:#8ab3ff}.letter{font-size:40px;font-weight:950;width:52px;text-align:center}.choiceText{font-size:clamp(23px,6vw,32px);font-weight:950;line-height:1.15}.choices.locked .choice{opacity:.38;filter:saturate(.5)}.choices.locked .choice.selected{opacity:1;filter:none;outline:4px solid white;outline-offset:2px;box-shadow:0 0 0 7px rgba(255,255,255,.08)}.arenaWrap{display:none;margin-top:16px}.arenaWrap.show{display:block}.arenaHeader{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 7px}.arenaTitle{font-size:13px;color:#fff;font-weight:950}.arenaNote{font-size:11px;color:#94a3b8}.arena{position:relative;height:260px;border-radius:20px;overflow:hidden;background:linear-gradient(#173152 0 56%,#32452c 56% 67%,#5f4931 67% 100%);border:1px solid rgba(255,255,255,.08)}.arena:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.23)}.zone{position:absolute;top:12px;font-size:24px;font-weight:950;z-index:2;text-shadow:0 2px 8px #000}.zone.a{left:18px;color:#ff8797}.zone.b{right:18px;color:#8eb6ff}.avatars{position:absolute;inset:0}.avatar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);transition:left .48s cubic-bezier(.2,.8,.2,1),bottom .48s ease,opacity .45s ease;z-index:4;text-align:center;min-width:58px}.avatar .head{font-size:29px;line-height:1}.avatar .body{width:18px;height:28px;background:#f8d36b;border-radius:8px 8px 5px 5px;margin:1px auto 0;position:relative}.avatar .body:before,.avatar .body:after{content:"";position:absolute;top:7px;width:14px;height:5px;background:#f8d36b;border-radius:6px}.avatar .body:before{left:-10px;transform:rotate(18deg)}.avatar .body:after{right:-10px;transform:rotate(-18deg)}.avatar .legs{display:flex;gap:7px;justify-content:center}.avatar .legs span{width:5px;height:13px;background:#f8d36b;border-radius:5px}.avatar .name{margin-top:4px;background:rgba(6,10,20,.84);padding:3px 7px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap;max-width:95px;overflow:hidden;text-overflow:ellipsis}.avatar.me .name{background:var(--gold);color:#111827;outline:2px solid white}.avatar.me .name:after{content:" YOU";font-size:8px}.avatar.predead{opacity:.2;filter:grayscale(1)}.avatar.cheer .head,.avatar.cheer .body{animation:bounce .55s ease-in-out 2}.avatar.cheer .body:before{transform:rotate(-45deg);top:2px}.avatar.cheer .body:after{transform:rotate(45deg);top:2px}.avatar.fall{animation:fall .85s ease-in forwards}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}@keyframes fall{0%{transform:translateX(-50%) rotate(0);opacity:1}100%{transform:translateX(-50%) translateY(180px) rotate(40deg);opacity:.05}}.waiting{display:none;text-align:center;margin-top:14px;padding:16px;border-radius:18px;background:#0d1427;color:#cbd5e1;font-weight:800}.waiting.show{display:block}.waiting strong{display:block;color:#fff;font-size:21px;margin-bottom:5px}.waiting .sub{font-size:13px;color:#94a3b8}.result{display:none;margin-top:14px;background:#0d1427;border-radius:20px;padding:20px}.result.show{display:block}.resultTitle{font-size:27px;font-weight:950}.correct{color:var(--ok)}.explain{margin-top:10px;color:#cbd5e1;line-height:1.6}.eliminated{font-size:34px;font-weight:950;color:#ff7386;margin-top:14px}.winner{font-size:34px;font-weight:950;color:var(--gold);margin-top:14px}.you{font-size:13px;color:#94a3b8;text-align:center;padding-top:4px}@media(min-width:700px){.screen{width:min(620px,100%);margin:auto}.choice{min-height:130px}.arena{height:290px}}
</style></head>
<body><div class="screen"><div class="brand"><h1>⚡ 二択サバイバル</h1><p>選んで、生き残れ。</p></div><section id="joinCard" class="card"><div class="joinTitle">名前を入れて<br>ゲームに参加</div><input id="nameInput" class="input" maxlength="12" placeholder="ニックネーム" autocomplete="off"><button id="joinBtn" class="btn join">参加する</button></section><section id="game" class="game"><div class="status"><span id="phase" class="pill">待機中</span><span id="aliveText">生存 0人</span></div><div class="card questionCard"><div id="round" class="round">READY</div><div id="rule" class="rule"></div><div id="qText" class="qtext">ホストが問題を出すまで待ってね</div><div id="choices" class="choices" style="display:none"><button class="choice a" data-choice="A"><span class="letter">A</span><span id="choiceA" class="choiceText"></span></button><button class="choice b" data-choice="B"><span class="letter">B</span><span id="choiceB" class="choiceText"></span></button></div><div id="arenaWrap" class="arenaWrap"><div class="arenaHeader"><div id="arenaTitle" class="arenaTitle">みんなのキャラクター</div><div id="arenaNote" class="arenaNote">回答するとキャラが移動</div></div><div class="arena"><div class="zone a">← A</div><div class="zone b">B →</div><div id="avatars" class="avatars"></div></div></div><div id="waiting" class="waiting"><strong id="waitingTitle">回答済み</strong><div id="waitingSub" class="sub">結果発表までお待ちください</div></div><div id="result" class="result"><div id="resultTitle" class="resultTitle"></div><div id="explain" class="explain"></div><div id="resultBig"></div></div></div><div id="you" class="you"></div></section></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let joined=false,myName='',myChoice=null,myStatus='alive',currentRule='quiz',currentPhase='lobby',allPlayers={},pendingCorrect=null;const labels={lobby:'待機中',question:'回答受付中',result:'結果発表',finished:'ゲーム終了'};
$('joinBtn').onclick=join;$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')join()});function join(){const n=$('nameInput').value.trim();if(!n)return;myName=n;socket.emit('join',n)}
socket.on('joined',d=>{joined=true;myName=d.name;$('joinCard').style.display='none';$('game').classList.add('show');$('you').textContent=`あなた：${myName}`;renderPlayers(allPlayers)});
socket.on('gameState',s=>{if(!joined)return;currentPhase=s.phase;$('phase').textContent=labels[s.phase]||s.phase;$('aliveText').textContent=`生存 ${s.aliveCount}人`;$('round').textContent=s.round?`ROUND ${s.round}`:'READY';if(s.phase==='lobby'&&!s.currentQuestion){myChoice=null;pendingCorrect=null;$('choices').style.display='none';$('waiting').classList.remove('show');$('result').classList.remove('show');$('rule').textContent='';$('qText').textContent=s.round?'次の問題を待とう':'ホストが問題を出すまで待ってね';$('arenaWrap').classList.remove('show');clearResultClasses();renderPlayers(allPlayers)}if(s.currentQuestion&&s.phase==='question')showQuestion(s.currentQuestion)});socket.on('question',q=>{if(joined)showQuestion(q)});
function showQuestion(q){currentRule=q.rule||'quiz';myChoice=null;pendingCorrect=null;$('rule').textContent=currentRule==='majority'?'👥 多数派に入れば生き残り・他の人の選択は発表まで非公開':'🎯 正解を当てれば生き残り';$('arenaTitle').textContent=currentRule==='majority'?'投票中':'みんなのキャラクター';$('arenaNote').textContent=currentRule==='majority'?'他の人の移動先は発表まで非公開':'回答するとキャラが移動';$('qText').textContent=q.question;$('choiceA').textContent=q.choiceA;$('choiceB').textContent=q.choiceB;$('waiting').classList.remove('show');$('result').classList.remove('show');$('arenaWrap').classList.add('show');clearResultClasses();if(myStatus==='dead'){showSpectator();renderPlayers(allPlayers);return}$('choices').style.display='grid';$('choices').classList.remove('locked');document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));renderPlayers(allPlayers)}
function playerTarget(p,indexMap,id){let choice=p.choice;if(currentRule==='majority'&&currentPhase==='question'&&id===socket.id&&myChoice)choice=myChoice;const key=choice==='A'?'A':choice==='B'?'B':'C',i=indexMap[key]++;const base=key==='A'?24:key==='B'?76:50;const spread=((i%5)-2)*4;const row=Math.floor(i/5);return{left:`${base+spread}%`,bottom:`${24+row*48}px`}}
function renderPlayers(ps){allPlayers=ps||{};const box=$('avatars');const ids=new Set(Object.keys(allPlayers));box.querySelectorAll('.avatar').forEach(el=>{if(!ids.has(el.dataset.id))el.remove()});const indexMap={A:0,B:0,C:0};Object.entries(allPlayers).forEach(([id,p])=>{let el=box.querySelector(`[data-id="${cssEscape(id)}"]`);const isNew=!el;if(!el){el=document.createElement('div');el.className='avatar';el.dataset.id=id;el.style.left='50%';el.style.bottom='24px';el.innerHTML=`<div class="head">🙂</div><div class="body"></div><div class="legs"><span></span><span></span></div><div class="name"></div>`;box.appendChild(el)}el.querySelector('.name').textContent=p.name;const classes=['avatar'];if(id===socket.id)classes.push('me');if(p.status==='dead'&&currentPhase==='question')classes.push('predead');if(!el.classList.contains('cheer')&&!el.classList.contains('fall'))el.className=classes.join(' ');else{const anim=el.classList.contains('cheer')?'cheer':'fall';el.className=classes.concat(anim).join(' ')}const target=playerTarget(p,indexMap,id);if(isNew)requestAnimationFrame(()=>{el.style.left=target.left;el.style.bottom=target.bottom});else{el.style.left=target.left;el.style.bottom=target.bottom}})}
function clearResultClasses(){document.querySelectorAll('.avatar').forEach(el=>{el.classList.remove('cheer','fall')})}function animateResults(correct){Object.entries(allPlayers).forEach(([id,p])=>{const el=$('avatars').querySelector(`[data-id="${cssEscape(id)}"]`);if(!el||p.status==='dead'&&!p.choice)return;const survived=correct==='TIE'?Boolean(p.choice):p.choice===correct;el.classList.remove('cheer','fall');if(survived&&p.choice)el.classList.add('cheer');else if(p.choice)el.classList.add('fall')})}function cssEscape(s){return window.CSS&&CSS.escape?CSS.escape(s):String(s).replace(/[^a-zA-Z0-9_-]/g,'\\$&')}
function showSpectator(){$('choices').style.display='none';$('arenaWrap').classList.add('show');$('waiting').classList.add('show');$('waitingTitle').textContent='脱落しました';$('waitingSub').textContent=currentRule==='majority'?'投票先は発表まで非公開。結果を待とう…':'みんなの移動を見ながら勝者が決まるまで観戦中…'}
document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(myStatus!=='alive'||myChoice||currentPhase!=='question')return;myChoice=btn.dataset.choice;socket.emit('choose',myChoice);$('choices').classList.add('locked');btn.classList.add('selected');renderPlayers(allPlayers);$('waitingTitle').textContent=`${myChoice} を選択しました`;$('waitingSub').textContent=currentRule==='majority'?'回答済みです。他の人の選択は発表まで非公開':'回答済みです。みんなの選択を見ながら結果を待とう';$('waiting').classList.add('show');if(navigator.vibrate)navigator.vibrate(25)});socket.on('choiceAccepted',c=>{myChoice=c;renderPlayers(allPlayers)});socket.on('update',ps=>{allPlayers=ps||{};const me=allPlayers[socket.id];if(me){myStatus=me.status;if(currentPhase==='question'&&myChoice){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.choice===myChoice));$('choices').classList.add('locked')}}if(joined){renderPlayers(allPlayers);if(pendingCorrect&&currentPhase!=='question'){const c=pendingCorrect;pendingCorrect=null;setTimeout(()=>animateResults(c),70)}}});
socket.on('showAnswer',d=>{if(!joined)return;currentRule=d.rule||currentRule;$('waiting').classList.remove('show');$('result').classList.add('show');if(d.rule==='majority')pendingCorrect=d.correct;else animateResults(d.correct);let title;if(d.correct==='TIE')title='同数！回答した人は全員セーフ';else{const t=d.correct==='A'?d.choiceA:d.choiceB;title=d.rule==='majority'?`多数派は <span class="correct">${d.correct}「${escapeHtml(t)}」</span> (${d.counts.A}:${d.counts.B})`:`正解は <span class="correct">${d.correct}「${escapeHtml(t)}」</span>`}$('resultTitle').innerHTML=title;$('explain').textContent=d.explanation||'';const survived=myStatus==='alive'&&(d.correct==='TIE'?Boolean(myChoice):myChoice===d.correct);const big=$('resultBig');if(d.winner){big.className='winner';big.textContent=d.winner===myName?'🏆 あなたの優勝！':`🏆 優勝：${d.winner}`}else if(survived){big.className='winner';big.textContent='⭕ 生き残り！'}else{big.className='eliminated';big.textContent='💀 脱落…'}$('choices').style.display='none'});socket.on('gameReset',()=>{myStatus='alive';myChoice=null;pendingCorrect=null;$('result').classList.remove('show');$('qText').textContent='新しいゲームが始まります';$('choices').style.display='none';$('waiting').classList.remove('show');$('arenaWrap').classList.remove('show');clearResultClasses();renderPlayers(allPlayers)});function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
